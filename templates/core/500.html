{% extends 'base.html' %}
{% block title %}500 — Server Error — {{ BRAND_NAME }}{% endblock %}
{% block footer %}{% endblock %}
{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
  <div>
    <div style="font-family: var(--font-heading); font-size: 6rem; font-weight: 800; color: var(--border-primary); line-height: 1; margin-bottom: 1rem;">500</div>
    <h2 style="margin-bottom: 0.75rem;">Something Went Wrong</h2>
    <p style="color: var(--text-secondary); margin-bottom: 2rem; max-width: 400px;">Our engineering team has been notified. Please try again in a moment.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary">Go Home</a>
  </div>
</div>
{% endblock %}
