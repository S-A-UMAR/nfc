# render.yaml — STRIDE Platform Render deployment configuration
# Standard PostgreSQL Database (Neon) + Cloudinary Persistent Media Storage

services:
  - type: web
    name: stride
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false   # e.g. stride.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false   # e.g. https://stride.onrender.com
      - key: SITE_URL
        sync: false   # e.g. https://stride.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "2592000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "False"
      - key: DATABASE_URL
        sync: false   # Neon PostgreSQL connection string (postgresql://user:password@host/neondb?sslmode=require)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false   # Secret — enter in Render dashboard manually
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: STRIDE
      - key: PAYSTACK_PUBLIC_KEY
        sync: false   # Use pk_test_...
      - key: PAYSTACK_SECRET_KEY
        sync: false   # Use sk_test_...
      - key: PAYSTACK_TEST_MODE
        value: "True"
      - key: BRAND_NAME
        value: STRIDE
