# render.yaml — UZYRA Platform Render deployment configuration
# Persistent TiDB Serverless Database + Cloudinary Persistent Media Storage

services:
  - type: web
    name: uzyra
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false   # e.g. uzyra.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false   # e.g. https://uzyra.onrender.com
      - key: SITE_URL
        sync: false   # e.g. https://uzyra.onrender.com
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_USER
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_DB_NAME
        value: "uzyra"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false   # Secret — enter in Render dashboard manually
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: UZYRA
      - key: PAYSTACK_PUBLIC_KEY
        sync: false   # Use TEST key: pk_test_...
      - key: PAYSTACK_SECRET_KEY
        sync: false   # Use TEST key: sk_test_...
      - key: PAYSTACK_TEST_MODE
        value: "True"
      - key: BRAND_NAME
        value: UZYRA

