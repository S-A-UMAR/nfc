# render.yaml — UZYRA Platform Render deployment configuration
# Temporary staging with SQLite3 — NOT for production user data
#
# NOTE: SQLite on Render's free tier uses an ephemeral filesystem.
# The database will be RESET on every redeploy or server restart.
# This is acceptable for testing. Migrate to PostgreSQL before production.

services:
  - type: web
    name: uzyra
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false   # Set this to your-app-name.onrender.com after first deploy
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false   # Set this to https://your-app-name.onrender.com after first deploy
      - key: SITE_URL
        sync: false   # Set this to https://your-app-name.onrender.com after first deploy
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
      - key: BREVO_API_KEY
        sync: false   # Secret — enter in Render dashboard manually
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: UZYRA
      - key: PAYSTACK_PUBLIC_KEY
        sync: false   # Use TEST key: pk_test_...
      - key: PAYSTACK_SECRET_KEY
        sync: false   # Use TEST key: sk_test_...
      - key: PAYSTACK_TEST_MODE
        value: "True"
      - key: BRAND_NAME
        value: UZYRA
